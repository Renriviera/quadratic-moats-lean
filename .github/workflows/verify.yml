name: Verify Lean proofs

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned elan
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/quadratic-moat-elan"
          cd "$RUNNER_TEMP/quadratic-moat-elan"
          curl --fail --location --retry 3 \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output elan.tar.gz
          echo '42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  elan.tar.gz' | sha256sum --check
          tar -xzf elan.tar.gz
          ./elan-init -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Bootstrap pinned Lean and patched dependencies
        run: python3 scripts/bootstrap.py

      - name: Download mathlib cache
        run: ./lakew exe cache get

      - name: Check dependency lockfile
        run: git diff --exit-code -- lake-manifest.json lean-toolchain

      - name: Build proof library
        run: ./lakew build

      - name: Audit original and bounded-factor theorems
        run: python3 scripts/check_axioms.py
